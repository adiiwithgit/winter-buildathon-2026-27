<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <img
      class="avatar"
      src="avatar.png"
      alt="Profile photo"
      width="150"
      height="150"
    />
    <h1 class="name">Your Name</h1>
    <p class="role">B.Tech Student</p>
    <p class="bio">Building things at Winter Buildathon 2026-27.</p>

    <ul class="stats">
      <li><strong>2</strong><span>Days</span></li>
      <li><strong>1</strong><span>Projects</span></li>
      <li><strong>100%</strong><span>Focus</span></li>
    </ul>

    <div class="links">
      <a href="https://github.com/adiiwithgit" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/aditya-chavan-081114adicn" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </main>
</body>
</html>
