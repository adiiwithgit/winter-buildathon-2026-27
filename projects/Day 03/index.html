<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="brand" aria-hidden="true">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <h2>Ship something<br>you're proud of.</h2>
      <p>Pick up your project right where you left it.</p>
    </section>

    <section class="panel">
      <form id="login" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to continue to your workspace.</p>

        <button type="button" class="btn ghost" id="google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>

        <div class="or"><span>or use your email</span></div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@college.edu" required>
          <small class="err" id="email-err" role="alert"></small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
            <button type="button" id="toggle" aria-label="Show password">Show</button>
          </div>
          <small class="err" id="password-err" role="alert"></small>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember"> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn primary" id="submit">Sign in</button>
        <p class="status" id="status" role="status"></p>
        <p class="foot">New here? <a href="#">Create an account</a></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
